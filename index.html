<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dispensa</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dispensa">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#1c8c5b">
<style>
  :root{
    --bg:#0f1512; --card:#171f1b; --card2:#1e2822; --text:#eef2ee; --muted:#9db3a6;
    --green:#2fbf71; --amber:#e8a93a; --red:#e8543a; --accent:#1c8c5b; --border:#2a352e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,Roboto,sans-serif;}
  body{padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);}
  #app{max-width:520px;margin:0 auto;padding:14px 14px 100px;}
  header{position:sticky;top:0;background:var(--bg);padding:10px 0 6px;z-index:5;}
  h1{font-size:22px;margin:4px 0 10px;font-weight:700;}
  .tabs{display:flex;gap:8px;margin-bottom:10px;}
  .tab{flex:1;text-align:center;padding:10px;border-radius:12px;background:var(--card);
    color:var(--muted);font-weight:600;font-size:14px;border:1px solid var(--border);}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .searchbar{display:flex;gap:8px;margin-bottom:10px;}
  input,select,textarea{background:var(--card2);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;font-size:15px;width:100%;}
  .searchbar input{flex:1;}
  .summary{display:flex;gap:8px;margin-bottom:14px;}
  .pill{flex:1;background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:10px;text-align:center;}
  .pill b{display:block;font-size:20px;}
  .pill.warn b{color:var(--amber);} .pill.crit b{color:var(--red);} .pill.ok b{color:var(--green);}
  .group{margin-bottom:16px;}
  .group h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    margin:0 0 8px;padding-left:2px;}
  .item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .item .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
  .dot.green{background:var(--green);} .dot.amber{background:var(--amber);} .dot.red{background:var(--red);}
  .item .info{flex:1;min-width:0;}
  .item .name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .item .meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .item .qty{font-size:12px;color:var(--muted);white-space:nowrap;}
  .empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px;}
  .fab{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));
    width:58px;height:58px;border-radius:50%;background:var(--accent);color:#fff;font-size:28px;
    border:none;box-shadow:0 6px 18px rgba(0,0,0,.4);z-index:10;}
  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:20;}
  .sheet-backdrop.show{display:block;}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom));
    transform:translateY(100%);transition:transform .25s ease;z-index:21;max-height:88vh;overflow-y:auto;}
  .sheet.show{transform:translateY(0);}
  .sheet h3{margin:0 0 12px;font-size:17px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;}
  .row2{display:flex;gap:8px;}
  .row2>div{flex:1;}
  .btnrow{display:flex;gap:10px;margin-top:14px;}
  button.primary{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px;
    font-size:15px;font-weight:600;flex:1;}
  button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);
    border-radius:10px;padding:12px;font-size:15px;flex:1;}
  button.danger{background:transparent;color:var(--red);border:1px solid var(--red);
    border-radius:10px;padding:12px;font-size:14px;width:100%;margin-top:8px;}
  button.scanbtn{background:var(--card2);color:var(--text);border:1px dashed var(--muted);
    border-radius:10px;padding:10px;font-size:14px;width:100%;margin-bottom:10px;}
  #scanner{position:fixed;inset:0;background:#000;z-index:30;display:none;}
  #scanner.show{display:block;}
  #reader{width:100%;height:100%;}
  #scanner .closebtn{position:absolute;top:calc(16px + env(safe-area-inset-top));right:16px;
    z-index:31;background:rgba(0,0,0,.6);color:#fff;border:none;border-radius:20px;padding:10px 16px;}
  .toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#2a352e;
    color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;opacity:0;
    transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}
  .toolbar{display:flex;gap:8px;margin:6px 0 4px;}
  .iconbtn{background:var(--card2);border:1px solid var(--border);color:var(--muted);
    border-radius:10px;padding:8px 10px;font-size:12px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🥦 Dispensa</h1>
    <div class="tabs">
      <div class="tab active" data-loc="frigo">Frigo</div>
      <div class="tab" data-loc="dispensa">Dispensa</div>
    </div>
    <div class="searchbar">
      <input id="search" type="search" placeholder="Cerca alimento...">
    </div>
    <div class="summary">
      <div class="pill crit"><b id="cnt-expired">0</b>scadute</div>
      <div class="pill warn"><b id="cnt-soon">0</b>in scadenza</div>
      <div class="pill ok"><b id="cnt-total">0</b>totali</div>
    </div>
    <div class="toolbar">
      <button class="iconbtn" id="btn-export">⬇︎ Esporta</button>
      <button class="iconbtn" id="btn-import">⬆︎ Importa</button>
      <button class="iconbtn" id="btn-notify">🔔 Notifiche</button>
    </div>
  </header>
  <div id="list"></div>
</div>

<button class="fab" id="btn-add">+</button>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <h3 id="sheet-title">Nuovo alimento</h3>
  <button class="scanbtn" id="btn-scan">📷 Scansiona codice a barre</button>
  <div class="field">
    <label>Nome</label>
    <input id="f-name" type="text" placeholder="Es. Petto di pollo">
  </div>
  <div class="row2">
    <div class="field">
      <label>Luogo</label>
      <select id="f-loc">
        <option value="frigo">Frigo</option>
        <option value="dispensa">Dispensa</option>
      </select>
    </div>
    <div class="field">
      <label>Categoria</label>
      <select id="f-cat">
        <option value="Proteine">Proteine</option>
        <option value="Carboidrati">Carboidrati</option>
        <option value="Grassi">Grassi</option>
        <option value="Frutta e Verdura">Frutta e Verdura</option>
        <option value="Altro">Altro</option>
      </select>
    </div>
  </div>
  <div class="row2">
    <div class="field">
      <label>Quantità</label>
      <input id="f-qty" type="text" placeholder="Es. 2 confezioni">
    </div>
    <div class="field">
      <label>Scadenza</label>
      <input id="f-exp" type="date">
    </div>
  </div>
  <div class="field">
    <label>Note (opzionale)</label>
    <input id="f-notes" type="text" placeholder="Es. aperto il 12/08">
  </div>
  <div class="btnrow">
    <button class="secondary" id="btn-cancel">Annulla</button>
    <button class="primary" id="btn-save">Salva</button>
  </div>
  <button class="danger" id="btn-delete" style="display:none;">Elimina alimento</button>
</div>

<div id="scanner">
  <button class="closebtn" id="btn-close-scan">Chiudi ✕</button>
  <div id="reader"></div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
